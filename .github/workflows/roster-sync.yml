name: Clanmitglieder stündlich prüfen
on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - roster_sync.py
      - test_roster_sync.py
      - .github/workflows/roster-sync.yml
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: clan-war-pages
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Neueintritte und Wiedereintritte prüfen
        run: python3 -m unittest -v test_roster_sync.py
      - name: Aktuellen Mitgliederstand abrufen
        env:
          CLASH_ROYALE_API_TOKEN: ${{ secrets.CLASH_ROYALE_API_TOKEN }}
        run: python3 roster_sync.py
      - name: Mitgliederstand speichern
        run: |
          git config user.name 'Clanwar updater'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/data.json member-state.json roster-state.json
          git diff --cached --quiet || git commit -m 'Sync current clan roster and observed join dates'
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
