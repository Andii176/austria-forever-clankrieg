name: Clanmitglieder viermal täglich prüfen
on:
  schedule:
    - cron: '37 0,6,13,19 * * *'
      timezone: Europe/Vienna
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - roster_sync.py
      - test_roster_sync.py
      - .github/workflows/roster-sync.yml
permissions:
  actions: read
  contents: write
  pages: write
  id-token: write
concurrency:
  group: clan-war-pages
  cancel-in-progress: false
  queue: max
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wartenden CW-Aktualisierungen Vorrang geben
        id: priority
        uses: actions/github-script@v7
        with:
          script: |
            const warPaths = new Set([
              '.github/workflows/clan-war.yml',
              '.github/workflows/live-war.yml',
            ]);
            let warPending = false;
            for (const status of ['pending', 'queued', 'waiting', 'in_progress', 'requested']) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                ...context.repo,
                branch: 'main',
                status,
                per_page: 100,
              });
              if (runs.some(run => warPaths.has(run.path.split('@')[0]))) {
                warPending = true;
                break;
              }
            }
            core.setOutput('run_roster', String(!warPending));
            core.info(warPending
              ? 'Spielerprüfung übersprungen: Ein CW-Update hat Vorrang.'
              : 'Kein CW-Update wartet. Spielerprüfung wird ausgeführt.');
      - if: steps.priority.outputs.run_roster == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
      - if: steps.priority.outputs.run_roster == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: steps.priority.outputs.run_roster == 'true'
        name: Neueintritte und Wiedereintritte prüfen
        run: python3 -m unittest -v test_roster_sync.py
      - if: steps.priority.outputs.run_roster == 'true'
        name: Aktuellen Mitgliederstand abrufen
        env:
          CLASH_ROYALE_API_TOKEN: ${{ secrets.CLASH_ROYAL_API_TOKEN || secrets.CLASH_ROYALE_API_TOKEN }}
        run: python3 roster_sync.py
      - if: steps.priority.outputs.run_roster == 'true'
        name: Mitgliederstand speichern
        run: |
          git config user.name 'Clanwar updater'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/data.json member-state.json roster-state.json
          git diff --cached --quiet || git commit -m 'Sync current clan roster and observed join dates'
          git push
      - if: steps.priority.outputs.run_roster == 'true'
        uses: actions/configure-pages@v5
      - if: steps.priority.outputs.run_roster == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - if: steps.priority.outputs.run_roster == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
